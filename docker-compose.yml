services:
  backend:
    build:
      context: ./backend
    container_name: ${DOCSCOOL_BACKEND_CONTAINER:-contract-backend}
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/instance:/app/instance
      - ${DOCSCOOL_STORAGE_HOST_PATH:-/volume1/contracts}:${CONTRACT_STORAGE_ROOT:-/volume1/contracts}
    ports:
      - "${DOCSCOOL_BACKEND_PORT:-5000}:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ${DOCSCOOL_FRONTEND_CONTAINER:-contract-frontend}
    depends_on:
      - backend
    ports:
      - "${DOCSCOOL_FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
